version: 2

build:
  os: ubuntu-lts-latest
  # apt_packages:
  #   - just
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install --upgrade pip
      - pip install uv
    build:
      html:
        # this would be preferable but readthedocs' ubuntu doesn't seem to have `just` available as a package
        # - just doc ${READTHEDOCS_OUTPUT}/html
        - mkdir -p ${READTHEDOCS_OUTPUT}/html
        - uv run --group doc pdoc --output-directory ${READTHEDOCS_OUTPUT}/html --no-include-undocumented --docformat numpy --search transformnd
        - mkdir -p ${READTHEDOCS_OUTPUT}/html/examples
        - uv run --group examples marimo export html examples/tutorial.py -o ${READTHEDOCS_OUTPUT}/html/examples/tutorial.html
        - uv run --group examples marimo export html examples/image.py -o ${READTHEDOCS_OUTPUT}/html/examples/image.html
