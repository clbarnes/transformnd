version: 2

build:
  os: ubuntu-lts-latest
  # apt_packages:
  #   - just
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install --upgrade pip
      - pip install uv
    build:
      html:
        # this would be preferable but readthedocs' ubuntu doesn't seem to have `just` available as a package
        # - just doc ${READTHEDOCS_OUTPUT}/html
        - mkdir -p ${READTHEDOCS_OUTPUT}/html
        - uv run just doc ${READTHEDOCS_OUTPUT}/html
